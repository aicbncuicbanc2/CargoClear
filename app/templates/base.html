<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Shipping Document Verification{% endblock %}</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
  <style>
    .badge { padding: 0.15rem 0.6rem; border-radius: 999px; font-size: 0.8rem; font-weight: 600; }
    .badge-match { background: #d4f4dd; color: #1e6b3c; }
    .badge-mismatch { background: #fbd6d6; color: #9b1c1c; }
    .badge-review { background: #fdeeb8; color: #8a6116; }
    .badge-na { background: #e2e2e2; color: #555; }
    .badge-category { background: #e3ecfa; color: #24457e; }
    nav.container { margin-bottom: 1rem; }

    /* Row tints reuse the badge palette so the table reads the same way. */
    tr.row-mismatch > td { background: #fdf0f0; }
    tr.row-match > td { color: #6b6b6b; }
    tr.row-review > td { background: #fdf8e7; }
    .muted { color: #8a8a8a; }

    .banner { border-left: 4px solid #999; padding: 0.75rem 1rem; margin: 1rem 0; }
    .banner-ok { border-color: #1e6b3c; background: #f2fbf5; }
    .banner-mismatch { border-color: #9b1c1c; background: #fdf0f0; }
    .banner-review { border-color: #8a6116; background: #fdf8e7; }
    .banner-na { border-color: #999; background: #f4f4f4; }

    .stats h3 { margin-bottom: 0.1rem; }
    .stat-mismatch { color: #9b1c1c; }
    .stat-review { color: #8a6116; }
    .filters { margin-bottom: 0.5rem; }

    /* Why the classifier said what it said — collapsed by default so the
       verdict stays the headline, expandable when it is challenged. */
    details.classification { margin: 0.5rem 0 1rem; font-size: 0.9rem; }
    details.classification summary { cursor: pointer; color: #555; }
    ul.signals { margin: 0.3rem 0 0 0.5rem; }
    /* A caveat on a settled verdict, not a verdict of its own. */
    small.note { font-style: italic; }

    pre.evidence {
      white-space: pre-wrap; word-break: break-word;
      font-size: 0.82rem; padding: 0.6rem 0.8rem; margin: 0;
    }
  </style>
</head>
<body>
  <nav class="container">
    <ul><li><strong>Shipping Document Verification</strong></li></ul>
    <ul>
      <li><a href="/">Inbox</a></li>
      <li><a href="/review">Review queue</a></li>
      <li><a href="/submission.json">submission.json</a></li>
    </ul>
  </nav>
  <main class="container">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
